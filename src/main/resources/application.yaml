server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/barbearia_db?createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password123}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

app:
  barbershop:
    name: ${APP_BARBERSHOP_NAME:Silva & Estilo}
  barber:
    name: ${APP_BARBER_NAME:Marcos Silva}
  security:
    admin-key: ${APP_ADMIN_KEY:SILVA2024}
